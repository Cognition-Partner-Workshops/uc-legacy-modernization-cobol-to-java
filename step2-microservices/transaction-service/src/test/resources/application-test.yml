spring:
  datasource:
    url: jdbc:h2:mem:carddemo_transactions_test;DB_CLOSE_DELAY=-1;NON_KEYWORDS=TRANSACTION
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

eureka:
  client:
    enabled: false
