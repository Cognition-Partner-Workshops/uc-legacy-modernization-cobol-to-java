server:
  port: 8086

spring:
  application:
    name: statement-service
  datasource:
    url: jdbc:postgresql://localhost:5432/carddemo
    username: carddemo
    password: carddemo
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: statement
  flyway:
    schemas:
      - statement

jwt:
  secret: CardDemoSecretKeyForJWTTokenGenerationMustBeAtLeast256Bits!!
  expiration-ms: 3600000
