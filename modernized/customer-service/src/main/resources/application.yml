server:
  port: 8082

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/carddemo
    username: carddemo
    password: carddemo
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: customer
  flyway:
    schemas:
      - customer

jwt:
  secret: CardDemoSecretKeyForJWTTokenGenerationMustBeAtLeast256Bits!!
  expiration-ms: 3600000
