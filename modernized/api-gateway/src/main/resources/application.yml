server:
  port: 8080

spring:
  application:
    name: api-gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/carddemo
    username: carddemo
    password: carddemo
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: api_gateway
  flyway:
    schemas:
      - api_gateway

gateway:
  routes:
    auth-service: http://localhost:8081
    customer-service: http://localhost:8082
    account-service: http://localhost:8083
    card-service: http://localhost:8084
    transaction-service: http://localhost:8085
    statement-service: http://localhost:8086
    authorization-service: http://localhost:8087

jwt:
  secret: CardDemoSecretKeyForJWTTokenGenerationMustBeAtLeast256Bits!!
  expiration-ms: 3600000
