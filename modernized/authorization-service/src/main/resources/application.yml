server:
  port: 8087

spring:
  application:
    name: authorization-service
  datasource:
    url: jdbc:postgresql://localhost:5432/carddemo
    username: carddemo
    password: carddemo
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: '"authorization"'
  flyway:
    schemas:
      - '"authorization"'

jwt:
  secret: CardDemoSecretKeyForJWTTokenGenerationMustBeAtLeast256Bits!!
  expiration-ms: 3600000
