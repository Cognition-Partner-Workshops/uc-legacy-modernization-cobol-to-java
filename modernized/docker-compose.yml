services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo
      POSTGRES_DB: carddemo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql

volumes:
  pgdata:
