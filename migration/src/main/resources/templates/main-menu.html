<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardDemo - Main Menu</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #000080; color: #00ff00; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 30px auto; background-color: #000040; padding: 30px; border: 2px solid #00ff00; }
        h1 { text-align: center; color: #ffffff; }
        h2 { text-align: center; color: #ffff00; }
        .menu-item { margin: 10px 0; padding: 10px; }
        .menu-item a { color: #00ff00; text-decoration: none; font-size: 16px; }
        .menu-item a:hover { color: #ffffff; }
        .header { text-align: center; border-bottom: 1px solid #00ff00; padding-bottom: 10px; margin-bottom: 20px; }
        .footer { text-align: center; border-top: 1px solid #00ff00; padding-top: 10px; margin-top: 20px; }
        .footer a { color: #ff0000; text-decoration: none; }
        .user-info { text-align: right; color: #ffff00; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-info">User: <span th:text="${username}">USER</span></div>
        <div class="header">
            <h1>AWS CardDemo</h1>
            <h2>MAIN MENU</h2>
        </div>
        <div class="menu-item">01. <a th:href="@{/accounts}">Account View</a></div>
        <div class="menu-item">02. <a th:href="@{/cards}">Card List</a></div>
        <div class="menu-item">03. <a th:href="@{/transactions}">Transaction List</a></div>
        <div class="menu-item">04. <a th:href="@{/transactions/add}">Add Transaction</a></div>
        <div class="menu-item">05. <a th:href="@{/reports}">Reports</a></div>
        <div class="menu-item">06. <a th:href="@{/billpay}">Bill Payment</a></div>
        <div class="menu-item" th:if="${isAdmin}">07. <a th:href="@{/admin/menu}">Admin Menu</a></div>
        <div class="footer">
            <a th:href="@{/logout}">SIGN OFF</a>
        </div>
    </div>
</body>
</html>
