<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CardDemo - Account Update</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #000080; color: #00ff00; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 30px auto; background-color: #000040; padding: 30px; border: 2px solid #00ff00; }
        h1 { text-align: center; color: #ffffff; }
        h2 { text-align: center; color: #ffff00; }
        .form-group { margin: 10px 0; }
        label { display: block; color: #ffff00; margin-bottom: 3px; }
        input { width: 100%; padding: 6px; font-family: 'Courier New', monospace; background-color: #000000; color: #00ff00; border: 1px solid #00ff00; box-sizing: border-box; }
        button { padding: 10px 20px; margin: 15px 5px 0 0; font-family: 'Courier New', monospace; background-color: #004400; color: #00ff00; border: 1px solid #00ff00; cursor: pointer; }
        button:hover { background-color: #006600; }
        a { color: #00ff00; text-decoration: none; }
        .nav { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav"><a th:href="@{/accounts/{id}(id=${account.acctId})}">&lt; Back to Account</a></div>
        <h1>AWS CardDemo</h1>
        <h2>ACCOUNT UPDATE</h2>
        <p>Account ID: <span th:text="${account.acctId}"></span></p>
        <form th:action="@{/accounts/{id}/edit(id=${account.acctId})}" method="post" th:object="${updateRequest}">
            <div class="form-group">
                <label>Active Status:</label>
                <input type="text" th:field="*{activeStatus}" th:placeholder="${account.activeStatus}" maxlength="1">
            </div>
            <div class="form-group">
                <label>Credit Limit:</label>
                <input type="number" step="0.01" th:field="*{creditLimit}" th:placeholder="${account.creditLimit}">
            </div>
            <div class="form-group">
                <label>Cash Credit Limit:</label>
                <input type="number" step="0.01" th:field="*{cashCreditLimit}" th:placeholder="${account.cashCreditLimit}">
            </div>
            <div class="form-group">
                <label>Expiration Date:</label>
                <input type="date" th:field="*{expirationDate}" th:placeholder="${account.expirationDate}">
            </div>
            <div class="form-group">
                <label>Reissue Date:</label>
                <input type="date" th:field="*{reissueDate}" th:placeholder="${account.reissueDate}">
            </div>
            <div class="form-group">
                <label>Group ID:</label>
                <input type="text" th:field="*{groupId}" th:placeholder="${account.groupId}" maxlength="10">
            </div>
            <button type="submit">UPDATE</button>
            <button type="button" onclick="history.back()">CANCEL</button>
        </form>
    </div>
</body>
</html>
