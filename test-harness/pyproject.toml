[project]
name = "carddemo-test-harness"
version = "0.1.0"
description = "Migration test harness for CardDemo COBOL-to-Java"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
