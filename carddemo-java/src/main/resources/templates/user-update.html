<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>CardDemo - Update User</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #000080; color: #00FF00; margin: 0; padding: 20px; }
        .screen { max-width: 80ch; margin: 0 auto; background-color: #000040; padding: 20px; border: 2px solid #00FF00; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #00FF00; padding-bottom: 5px; margin-bottom: 10px; }
        .title { text-align: center; font-size: 1.2em; font-weight: bold; margin: 10px 0; color: #FFFF00; }
        .content { margin: 10px 0; }
        .footer { border-top: 1px solid #00FF00; padding-top: 5px; margin-top: 10px; }
        .error { color: #FF0000; }
        a { color: #00FFFF; text-decoration: none; }
        input, select { font-family: 'Courier New', monospace; background-color: #000040; color: #00FF00; border: 1px solid #00FF00; padding: 2px 5px; }
        button { font-family: 'Courier New', monospace; background-color: #004000; color: #00FF00; border: 1px solid #00FF00; padding: 5px 15px; cursor: pointer; }
        .form-group { margin: 8px 0; } .form-group label { display: inline-block; width: 20ch; color: #FFFF00; }
    </style>
</head>
<body>
    <div class="screen">
        <div class="header">
            <div><span>Tran: </span><span th:text="${tranName}"></span> <span>Pgm: </span><span th:text="${pgmName}"></span></div>
            <div th:text="${#dates.format(new java.util.Date(), 'MM/dd/yy HH:mm:ss')}"></div>
        </div>
        <div class="title">User Security - Update User</div>
        <div class="content" th:if="${user}">
            <form th:action="@{'/admin/users/' + ${user.userId}}" method="post">
                <div class="form-group"><label>User ID:</label><span th:text="${user.userId}"></span></div>
                <div class="form-group"><label for="password">New Password:</label><input type="password" id="password" name="password" maxlength="8" size="8"/></div>
                <div class="form-group"><label for="firstName">First Name:</label><input type="text" id="firstName" name="firstName" maxlength="20" size="20" th:value="${user.firstName}"/></div>
                <div class="form-group"><label for="lastName">Last Name:</label><input type="text" id="lastName" name="lastName" maxlength="20" size="20" th:value="${user.lastName}"/></div>
                <div class="form-group">
                    <label for="userType">User Type:</label>
                    <select id="userType" name="userType">
                        <option value="U" th:selected="${user.userType == 'U'}">U - Regular User</option>
                        <option value="A" th:selected="${user.userType == 'A'}">A - Admin</option>
                    </select>
                </div>
                <div class="form-group" style="margin-top:15px;"><button type="submit">Update [Enter]</button><a href="/admin/users" style="margin-left:20px;">Cancel</a></div>
            </form>
        </div>
        <div class="footer">
            <div class="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <div><a href="/admin/users">Back to User List</a> | <a href="/menu">PF3 - Return to Menu</a></div>
        </div>
    </div>
</body>
</html>
