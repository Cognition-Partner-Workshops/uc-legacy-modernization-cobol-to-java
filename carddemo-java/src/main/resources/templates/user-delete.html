<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>CardDemo - Delete User</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #000080; color: #00FF00; margin: 0; padding: 20px; }
        .screen { max-width: 80ch; margin: 0 auto; background-color: #000040; padding: 20px; border: 2px solid #00FF00; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #00FF00; padding-bottom: 5px; margin-bottom: 10px; }
        .title { text-align: center; font-size: 1.2em; font-weight: bold; margin: 10px 0; color: #FF0000; }
        .content { margin: 10px 0; }
        .footer { border-top: 1px solid #00FF00; padding-top: 5px; margin-top: 10px; }
        .error { color: #FF0000; }
        a { color: #00FFFF; text-decoration: none; }
        button { font-family: 'Courier New', monospace; background-color: #400000; color: #FF0000; border: 1px solid #FF0000; padding: 5px 15px; cursor: pointer; }
        .field-row { margin: 4px 0; } .field-label { display: inline-block; width: 20ch; color: #FFFF00; }
    </style>
</head>
<body>
    <div class="screen">
        <div class="header">
            <div><span>Tran: </span><span th:text="${tranName}"></span> <span>Pgm: </span><span th:text="${pgmName}"></span></div>
            <div th:text="${#dates.format(new java.util.Date(), 'MM/dd/yy HH:mm:ss')}"></div>
        </div>
        <div class="title">User Security - Delete Confirmation</div>
        <div class="content" th:if="${user}">
            <div style="color:#FF0000;margin-bottom:15px;">Are you sure you want to delete this user?</div>
            <div class="field-row"><span class="field-label">User ID:</span><span th:text="${user.userId}"></span></div>
            <div class="field-row"><span class="field-label">First Name:</span><span th:text="${user.firstName}"></span></div>
            <div class="field-row"><span class="field-label">Last Name:</span><span th:text="${user.lastName}"></span></div>
            <div class="field-row"><span class="field-label">User Type:</span><span th:text="${user.userType == 'A' ? 'Admin' : 'User'}"></span></div>
            <div style="margin-top:15px;">
                <form th:action="@{'/admin/users/' + ${user.userId} + '/delete'}" method="post" style="display:inline;">
                    <button type="submit">Confirm Delete</button>
                </form>
                <a href="/admin/users" style="margin-left:20px;">Cancel</a>
            </div>
        </div>
        <div class="footer">
            <div class="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <div><a href="/admin/users">Back to User List</a></div>
        </div>
    </div>
</body>
</html>
