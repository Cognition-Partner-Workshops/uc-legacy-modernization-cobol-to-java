<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>CardDemo - Add Transaction</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #000080; color: #00FF00; margin: 0; padding: 20px; }
        .screen { max-width: 80ch; margin: 0 auto; background-color: #000040; padding: 20px; border: 2px solid #00FF00; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #00FF00; padding-bottom: 5px; margin-bottom: 10px; }
        .title { text-align: center; font-size: 1.2em; font-weight: bold; margin: 10px 0; color: #FFFF00; }
        .content { margin: 10px 0; }
        .footer { border-top: 1px solid #00FF00; padding-top: 5px; margin-top: 10px; }
        .error { color: #FF0000; } .info { color: #00FFFF; }
        a { color: #00FFFF; text-decoration: none; }
        input, select { font-family: 'Courier New', monospace; background-color: #000040; color: #00FF00; border: 1px solid #00FF00; padding: 2px 5px; }
        button { font-family: 'Courier New', monospace; background-color: #004000; color: #00FF00; border: 1px solid #00FF00; padding: 5px 15px; cursor: pointer; }
        .form-group { margin: 8px 0; } .form-group label { display: inline-block; width: 25ch; color: #FFFF00; }
    </style>
</head>
<body>
    <div class="screen">
        <div class="header">
            <div><span>Tran: </span><span th:text="${tranName}"></span> <span>Pgm: </span><span th:text="${pgmName}"></span></div>
            <div th:text="${#dates.format(new java.util.Date(), 'MM/dd/yy HH:mm:ss')}"></div>
        </div>
        <div class="title">Add Transaction</div>
        <div class="content">
            <form action="/transactions" method="post">
                <div class="form-group"><label for="cardNum">Card Number:</label><input type="text" id="cardNum" name="cardNum" maxlength="16" size="16" required="required"/></div>
                <div class="form-group"><label for="typeCd">Type Code:</label><input type="text" id="typeCd" name="typeCd" maxlength="2" size="2"/></div>
                <div class="form-group"><label for="catCd">Category Code:</label><input type="number" id="catCd" name="catCd" size="4"/></div>
                <div class="form-group"><label for="source">Source:</label><input type="text" id="source" name="source" maxlength="10" size="10"/></div>
                <div class="form-group"><label for="description">Description:</label><input type="text" id="description" name="description" maxlength="100" size="50"/></div>
                <div class="form-group"><label for="amount">Amount:</label><input type="number" id="amount" name="amount" step="0.01" size="12" required="required"/></div>
                <div class="form-group"><label for="merchantId">Merchant ID:</label><input type="number" id="merchantId" name="merchantId" size="9"/></div>
                <div class="form-group"><label for="merchantName">Merchant Name:</label><input type="text" id="merchantName" name="merchantName" maxlength="50" size="50"/></div>
                <div class="form-group"><label for="merchantCity">Merchant City:</label><input type="text" id="merchantCity" name="merchantCity" maxlength="50" size="30"/></div>
                <div class="form-group"><label for="merchantZip">Merchant Zip:</label><input type="text" id="merchantZip" name="merchantZip" maxlength="10" size="10"/></div>
                <div class="form-group" style="margin-top:15px;"><button type="submit">Add Transaction [Enter]</button></div>
            </form>
        </div>
        <div class="footer">
            <div class="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <div class="info" th:if="${infoMessage}" th:text="${infoMessage}"></div>
            <div><a href="/transactions">Back to List</a> | <a href="/menu">PF3 - Return to Menu</a></div>
        </div>
    </div>
</body>
</html>
