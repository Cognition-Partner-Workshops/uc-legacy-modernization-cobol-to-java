<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>CardDemo - Account Update</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #000080; color: #00FF00; margin: 0; padding: 20px; }
        .screen { max-width: 80ch; margin: 0 auto; background-color: #000040; padding: 20px; border: 2px solid #00FF00; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #00FF00; padding-bottom: 5px; margin-bottom: 10px; }
        .title { text-align: center; font-size: 1.2em; font-weight: bold; margin: 10px 0; color: #FFFF00; }
        .content { margin: 10px 0; }
        .footer { border-top: 1px solid #00FF00; padding-top: 5px; margin-top: 10px; }
        .error { color: #FF0000; }
        .info { color: #00FFFF; }
        a { color: #00FFFF; text-decoration: none; }
        input, select { font-family: 'Courier New', monospace; background-color: #000040; color: #00FF00; border: 1px solid #00FF00; padding: 2px 5px; }
        button { font-family: 'Courier New', monospace; background-color: #004000; color: #00FF00; border: 1px solid #00FF00; padding: 5px 15px; cursor: pointer; }
        .form-group { margin: 8px 0; }
        .form-group label { display: inline-block; width: 25ch; color: #FFFF00; }
    </style>
</head>
<body>
    <div class="screen">
        <div class="header">
            <div>
                <span>Tran: </span><span th:text="${tranName}">CAUP</span>
                <span> Pgm: </span><span th:text="${pgmName}">COACTUPC</span>
            </div>
            <div th:text="${#dates.format(new java.util.Date(), 'MM/dd/yy HH:mm:ss')}"></div>
        </div>
        <div class="title">Account Update</div>
        <div class="content" th:if="${account}">
            <form th:action="@{'/accounts/' + ${account.acctId}}" method="post">
                <div class="form-group">
                    <label>Account ID:</label>
                    <span th:text="${account.acctId}"></span>
                </div>
                <div class="form-group">
                    <label for="activeStatus">Active Status:</label>
                    <select id="activeStatus" name="activeStatus">
                        <option value="Y" th:selected="${account.activeStatus == 'Y'}">Y - Active</option>
                        <option value="N" th:selected="${account.activeStatus == 'N'}">N - Inactive</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="creditLimit">Credit Limit:</label>
                    <input type="number" id="creditLimit" name="creditLimit" step="0.01" th:value="${account.creditLimit}"/>
                </div>
                <div class="form-group">
                    <label for="cashCreditLimit">Cash Credit Limit:</label>
                    <input type="number" id="cashCreditLimit" name="cashCreditLimit" step="0.01" th:value="${account.cashCreditLimit}"/>
                </div>
                <div class="form-group">
                    <label for="expirationDate">Expiration Date:</label>
                    <input type="date" id="expirationDate" name="expirationDate" th:value="${account.expirationDate}"/>
                </div>
                <div class="form-group">
                    <label for="reissueDate">Reissue Date:</label>
                    <input type="date" id="reissueDate" name="reissueDate" th:value="${account.reissueDate}"/>
                </div>
                <div class="form-group">
                    <label for="groupId">Group ID:</label>
                    <input type="text" id="groupId" name="groupId" maxlength="10" th:value="${account.groupId}"/>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <button type="submit">Update [Enter]</button>
                    <a th:href="@{'/accounts/' + ${account.acctId}}" style="margin-left: 20px;">Cancel</a>
                </div>
            </form>
        </div>
        <div class="footer">
            <div class="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <div class="info" th:if="${infoMessage}" th:text="${infoMessage}"></div>
            <div><a href="/menu">PF3 - Return to Menu</a></div>
        </div>
    </div>
</body>
</html>
