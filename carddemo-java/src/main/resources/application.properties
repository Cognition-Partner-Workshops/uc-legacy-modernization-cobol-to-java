# Application
spring.application.name=carddemo-auth

# H2 Database
spring.datasource.url=jdbc:h2:mem:carddemo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Data initialization handled by DataInitializer bean
spring.sql.init.mode=never

# JWT Configuration
app.jwt.secret=CardDemoSecretKeyForJWTTokenGeneration2024MustBe256BitsLong!
app.jwt.expiration-ms=86400000

# Server
server.port=8080
