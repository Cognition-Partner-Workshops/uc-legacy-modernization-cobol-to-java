spring:
  application:
    name: user-security-service
  datasource:
    url: jdbc:h2:mem:usrsec;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    com.carddemo.usersecurity: INFO
