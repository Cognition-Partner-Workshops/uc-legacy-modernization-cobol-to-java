spring:
  application:
    name: carddemo-auth
  datasource:
    url: jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

carddemo:
  jwt:
    # Dev/test default. Override via CARDDEMO_JWT_SECRET in real deployments.
    secret: ${CARDDEMO_JWT_SECRET:change-me-dev-only-carddemo-auth-jwt-signing-secret-key}
    expiration-ms: ${CARDDEMO_JWT_EXPIRATION_MS:3600000}
