spring:
  datasource:
    url: jdbc:h2:mem:carddemo-test;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: warn
