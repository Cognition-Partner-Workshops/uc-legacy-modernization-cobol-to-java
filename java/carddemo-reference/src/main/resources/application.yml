spring:
  application:
    name: carddemo-reference
  datasource:
    url: jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true

server:
  port: 8080

logging:
  level:
    org.flywaydb: info
