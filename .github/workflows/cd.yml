name: CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carddemo
          POSTGRES_PASSWORD: carddemo
          POSTGRES_DB: carddemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: carddemo
        run: |
          pip install -e ".[dev]"
      - name: Run Alembic migrations
        working-directory: carddemo
        env:
          CARDDEMO_DATABASE_URL: postgresql://carddemo:carddemo@localhost:5432/carddemo
        run: |
          alembic upgrade head
      - name: Run full test suite
        working-directory: carddemo
        env:
          CARDDEMO_DATABASE_URL: postgresql://carddemo:carddemo@localhost:5432/carddemo
        run: |
          pytest tests/ -v --cov=app --cov-report=xml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t carddemo:${{ github.sha }} carddemo/
          docker tag carddemo:${{ github.sha }} carddemo:latest
      # Add deployment target here
      # Example: push to container registry, deploy to cloud, etc.
      - name: Deployment placeholder
        run: echo "Add deployment target here (e.g., push to ECR/GCR, deploy to ECS/GKE)"
