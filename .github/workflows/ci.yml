name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check carddemo/
      - name: Run ruff format check
        run: ruff format --check carddemo/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carddemo
          POSTGRES_PASSWORD: carddemo
          POSTGRES_DB: carddemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: carddemo
        run: |
          pip install -e ".[dev]"
      - name: Run Alembic migrations
        working-directory: carddemo
        env:
          CARDDEMO_DATABASE_URL: postgresql://carddemo:carddemo@localhost:5432/carddemo
        run: |
          alembic upgrade head
      - name: Run tests
        working-directory: carddemo
        env:
          CARDDEMO_DATABASE_URL: postgresql://carddemo:carddemo@localhost:5432/carddemo
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: carddemo/coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t carddemo:test carddemo/
