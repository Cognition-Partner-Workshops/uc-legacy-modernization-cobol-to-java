name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  validate-structure:
    name: Validate Repository Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate COBOL source files exist
        run: |
          echo "=== Validating COBOL source structure ==="
          echo "Checking COBOL programs..."
          ls app/cbl/*.cbl && echo "COBOL programs found" || echo "No .cbl files found"
          echo "Checking copybooks..."
          ls app/cpy/*.cpy && echo "Copybooks found" || echo "No .cpy files found"
          echo "Checking BMS maps..."
          ls app/bms/*.bms && echo "BMS maps found" || echo "No .bms files found"
          echo "Checking JCL jobs..."
          ls app/jcl/*.jcl && echo "JCL jobs found" || echo "No .jcl files found"
          echo "=== Structure validation complete ==="

      - name: Check for trailing whitespace and encoding issues
        run: |
          echo "=== Checking file encoding ==="
          file_count=0
          error_count=0
          for f in $(find app/cbl app/cpy app/bms -type f 2>/dev/null); do
            file_count=$((file_count + 1))
            if file "$f" | grep -qi "utf-16\|binary"; then
              echo "WARNING: Unexpected encoding in $f"
              error_count=$((error_count + 1))
            fi
          done
          echo "Checked $file_count files, found $error_count encoding issues"

  compile-cobol:
    name: Compile COBOL (GnuCOBOL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol

      - name: Compile COBOL programs (syntax check)
        run: |
          echo "=== COBOL Syntax Check ==="
          success=0
          fail=0
          for src in app/cbl/*.cbl; do
            filename=$(basename "$src")
            if cobc -fsyntax-only -I app/cpy -I app/cpy-bms "$src" 2>/dev/null; then
              echo "PASS: $filename"
              success=$((success + 1))
            else
              echo "SKIP: $filename (may require CICS/DB2 precompiler)"
              fail=$((fail + 1))
            fi
          done
          echo "=== Results: $success passed, $fail skipped ==="

  security-secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-codeql:
    name: Static Analysis (CodeQL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  security-trivy:
    name: Filesystem Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
