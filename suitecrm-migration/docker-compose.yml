version: '3.8'

services:
  # ============================================================
  # Infrastructure Services
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: suitecrm-postgres
    environment:
      POSTGRES_USER: suitecrm
      POSTGRES_PASSWORD: suitecrm_secret
      POSTGRES_MULTIPLE_DATABASES: >
        suitecrm_auth,suitecrm_contacts,suitecrm_accounts,
        suitecrm_opportunities,suitecrm_cases,suitecrm_campaigns,
        suitecrm_activities,suitecrm_reports,suitecrm_documents,
        suitecrm_workflows,suitecrm_project,suitecrm_email,
        suitecrm_kb,suitecrm_event,suitecrm_survey,
        suitecrm_product_catalog,suitecrm_target_list,suitecrm_connector,
        suitecrm_leads,suitecrm_quotes,suitecrm_calendar,
        suitecrm_maps,suitecrm_templates,suitecrm_scheduler,
        suitecrm_notifications
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suitecrm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suitecrm-network

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: suitecrm-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/suitecrm_auth
      KC_DB_USERNAME: suitecrm
      KC_DB_PASSWORD: suitecrm_secret
    command: start-dev
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - suitecrm-network

  redis:
    image: redis:7-alpine
    container_name: suitecrm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suitecrm-network

  # ============================================================
  # Spring Cloud Infrastructure
  # ============================================================
  discovery-server:
    build:
      context: ./backend/discovery-server
      dockerfile: Dockerfile
    container_name: suitecrm-discovery
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - suitecrm-network

  config-server:
    build:
      context: ./backend/config-server
      dockerfile: Dockerfile
    container_name: suitecrm-config
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - suitecrm-network

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: suitecrm-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - suitecrm-network

  # ============================================================
  # Domain Microservices
  # ============================================================
  auth-service:
