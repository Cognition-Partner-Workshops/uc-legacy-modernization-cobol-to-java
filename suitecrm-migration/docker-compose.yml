      DB_URL: jdbc:postgresql://postgres:5432/suitecrm_auth
      DB_USERNAME: suitecrm
      DB_PASSWORD: suitecrm_secret
      EUREKA_URI: http://discovery-server:8761/eureka
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/suitecrm
      JWT_SECRET: suitecrm-jwt-secret-key-for-development-only
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - suitecrm-network

