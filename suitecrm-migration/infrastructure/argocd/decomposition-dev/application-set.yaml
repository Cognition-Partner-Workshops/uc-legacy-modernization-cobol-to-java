apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: suitecrm-dev
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: discovery-server
            port: "8761"
            dbName: ""
          - service: config-server
            port: "8888"
            dbName: ""
          - service: api-gateway
            port: "8080"
            dbName: ""
          - service: auth-service
            port: "8081"
            dbName: suitecrm_auth
          - service: contact-service
            port: "8082"
            dbName: suitecrm_contacts
          - service: account-service
            port: "8083"
            dbName: suitecrm_accounts
          - service: opportunity-service
            port: "8084"
            dbName: suitecrm_opportunities
          - service: case-service
            port: "8085"
            dbName: suitecrm_cases
          - service: campaign-service
            port: "8086"
            dbName: suitecrm_campaigns
          - service: activity-service
            port: "8087"
            dbName: suitecrm_activities
          - service: report-service
            port: "8088"
            dbName: suitecrm_reports
          - service: document-service
            port: "8089"
            dbName: suitecrm_documents
          - service: workflow-service
            port: "8090"
            dbName: suitecrm_workflows
          - service: project-service
            port: "8091"
            dbName: suitecrm_project
          - service: email-service
            port: "8092"
            dbName: suitecrm_email
          - service: kb-service
            port: "8093"
            dbName: suitecrm_kb
          - service: event-service
            port: "8094"
            dbName: suitecrm_event
          - service: survey-service
            port: "8095"
            dbName: suitecrm_survey
          - service: target-list-service
            port: "8096"
            dbName: suitecrm_target_list
          - service: product-catalog-service
            port: "8097"
            dbName: suitecrm_product_catalog
          - service: connector-service
            port: "8098"
            dbName: suitecrm_connector
          - service: frontend
            port: "80"
            dbName: ""
  template:
    metadata:
      name: "suitecrm-{{service}}-dev"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: suitecrm
        environment: dev
    spec:
      project: default
      source:
        repoURL: https://github.com/Cognition-Partner-Workshops/uc-legacy-modernization-cobol-to-java.git
        targetRevision: HEAD
        path: suitecrm-migration/infrastructure/helm/suitecrm-service
        helm:
          valueFiles:
            - ../../values/dev/{{service}}.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: decomposition-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
