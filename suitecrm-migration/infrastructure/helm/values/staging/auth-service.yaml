replicaCount: 2
image:
  repository: suitecrm/auth-service
  tag: latest
nameOverride: auth-service
service:
  port: 8081
  targetPort: 8081
resources:
  limits: { cpu: 1000m, memory: 1Gi }
  requests: { cpu: 500m, memory: 512Mi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
spring:
  profiles: kubernetes
  datasource:
    url: jdbc:postgresql://suitecrm-aurora-staging:5432/suitecrm_auth
    username: suitecrm
    password: changeme
eureka:
  enabled: true
  uri: http://discovery-server:8761/eureka
keycloak:
  issuerUri: http://keycloak:8080/realms/suitecrm
