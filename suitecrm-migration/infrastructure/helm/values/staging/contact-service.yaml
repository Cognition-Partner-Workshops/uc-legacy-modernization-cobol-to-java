replicaCount: 2
image:
  repository: suitecrm/contact-service
  tag: latest
nameOverride: contact-service
service:
  port: 8082
  targetPort: 8082
resources:
  limits: { cpu: 500m, memory: 512Mi }
  requests: { cpu: 250m, memory: 256Mi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
spring:
  profiles: kubernetes
  datasource:
    url: jdbc:postgresql://suitecrm-aurora:5432/suitecrm_contacts
    username: suitecrm
    password: changeme
eureka:
  enabled: true
  uri: http://discovery-server:8761/eureka
keycloak:
  issuerUri: http://keycloak:8080/realms/suitecrm
