replicaCount: 1

image:
  repository: suitecrm/api-gateway
  tag: latest

nameOverride: api-gateway

service:
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

spring:
  profiles: kubernetes
  datasource:
    url: ""
    username: ""
    password: ""

eureka:
  enabled: true
  uri: http://discovery-server:8761/eureka

keycloak:
  issuerUri: http://keycloak:8080/realms/suitecrm

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: suitecrm-dev.example.com
      paths:
        - path: /api
          pathType: Prefix
