replicaCount: 1
image:
  repository: suitecrm/workflow-service
  tag: latest
nameOverride: workflow-service
service:
  port: 8090
  targetPort: 8090
resources:
  limits: { cpu: 500m, memory: 512Mi }
  requests: { cpu: 200m, memory: 256Mi }
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
spring:
  profiles: kubernetes
  datasource:
    url: jdbc:postgresql://suitecrm-aurora:5432/suitecrm_workflows
    username: suitecrm
    password: changeme
eureka:
  enabled: true
  uri: http://discovery-server:8761/eureka
keycloak:
  issuerUri: http://keycloak:8080/realms/suitecrm
