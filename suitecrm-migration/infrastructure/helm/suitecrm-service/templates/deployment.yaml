apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "suitecrm-service.fullname" . }}
  labels:
    {{- include "suitecrm-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "suitecrm-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "suitecrm-service.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.targetPort }}"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: {{ include "suitecrm-service.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.spring.profiles | default "kubernetes" }}
            {{- if .Values.spring.datasource.url }}
            - name: DB_URL
              value: {{ .Values.spring.datasource.url }}
            {{- end }}
            {{- if .Values.spring.datasource.username }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "suitecrm-service.fullname" . }}-db
                  key: username
            {{- end }}
            {{- if .Values.spring.datasource.password }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "suitecrm-service.fullname" . }}-db
                  key: password
            {{- end }}
            {{- if .Values.eureka.enabled }}
            - name: EUREKA_URI
              value: {{ .Values.eureka.uri }}
            {{- end }}
            - name: KEYCLOAK_ISSUER_URI
              value: {{ .Values.keycloak.issuerUri }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
