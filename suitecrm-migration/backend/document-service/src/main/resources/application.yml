server:
  port: 8089

spring:
  application:
    name: document-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/suitecrm_documents}
    username: ${DB_USERNAME:suitecrm}
    password: ${DB_PASSWORD:suitecrm_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: document_schema
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas:
      - document_schema
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/suitecrm}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

aws:
  s3:
    bucket: ${S3_BUCKET:suitecrm-documents}
    region: ${AWS_REGION:us-east-1}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://discovery-server:8761/eureka}
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
