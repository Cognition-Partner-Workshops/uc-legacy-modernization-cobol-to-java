server:
  port: 8084

spring:
  application:
    name: opportunity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/suitecrm_opportunities}
    username: ${DB_USERNAME:suitecrm}
    password: ${DB_PASSWORD:suitecrm_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: opportunity_schema
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas:
      - opportunity_schema
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/suitecrm}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://discovery-server:8761/eureka}
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
