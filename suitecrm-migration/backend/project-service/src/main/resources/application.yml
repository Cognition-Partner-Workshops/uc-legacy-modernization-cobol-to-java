server:
  port: 8091

spring:
  application:
    name: project-service
  datasource:
    url: jdbc:postgresql://localhost:5432/suitecrm_project
    username: ${DB_USERNAME:suitecrm}
    password: ${DB_PASSWORD:suitecrm}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: project_schema
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: project_schema
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/suitecrm}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.suitecrm.project: DEBUG
    org.springframework.security: INFO
