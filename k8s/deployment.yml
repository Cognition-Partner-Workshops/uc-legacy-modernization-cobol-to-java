# ============================================================
# CardDemo Deployment - Reactive Java Application
# Replaces mainframe CICS region deployment
#
# Legacy: CICS region with COBOL programs loaded via CEDA
# Modern: Kubernetes Deployment with rolling updates
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carddemo-app
  namespace: carddemo
  labels:
    app.kubernetes.io/name: carddemo
    app.kubernetes.io/component: application
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: carddemo
      app.kubernetes.io/component: application
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carddemo
        app.kubernetes.io/component: application
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: carddemo-sa
      containers:
        - name: carddemo
          image: carddemo-modernized:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: carddemo-config
            - secretRef:
                name: carddemo-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Kubernetes health probes (replaces CICS health monitoring)
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
      restartPolicy: Always
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: carddemo-sa
  namespace: carddemo
  labels:
    app.kubernetes.io/name: carddemo
