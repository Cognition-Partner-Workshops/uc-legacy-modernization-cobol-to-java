# ============================================================
# CardDemo Secrets - Sensitive Configuration
# Replaces mainframe RACF credentials and DB2 auth tokens
# NOTE: In production, use Kubernetes Secrets management
#       (e.g., Sealed Secrets, Vault, AWS Secrets Manager)
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-secrets
  namespace: carddemo
  labels:
    app.kubernetes.io/name: carddemo
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Replace these placeholder values before deploying.
  # In production, use Sealed Secrets, Vault, or external-secrets-operator.
  CASSANDRA_USERNAME: "<REPLACE_WITH_CASSANDRA_USERNAME>"
  CASSANDRA_PASSWORD: "<REPLACE_WITH_CASSANDRA_PASSWORD>"
  JDBC_USERNAME: "<REPLACE_WITH_JDBC_USERNAME>"
  JDBC_PASSWORD: "<REPLACE_WITH_JDBC_PASSWORD>"
  JWT_SECRET: "<REPLACE_WITH_JWT_SECRET_MIN_256_BITS>"
