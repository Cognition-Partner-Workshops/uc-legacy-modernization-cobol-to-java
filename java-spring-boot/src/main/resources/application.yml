spring:
  application:
    name: carddemo-file-match

  # H2 Database Configuration (replaces VSAM KSDS)
  datasource:
    url: jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # H2 Console (for debugging — access at /h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

# Server Configuration
server:
  port: 8080

# Application-specific settings
app:
  data-dir: classpath:data/
  match-criteria:
    # Filter accounts with active status 'Y' (equivalent to COBOL WS-MATCH-CRITERIA)
    account-active-status: "Y"
    # Filter transactions by type code (e.g., "SA" for Sale)
    transaction-type-code: "SA"
