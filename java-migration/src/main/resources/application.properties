# CardDemo Java Migration - Application Configuration
# Migrated from COBOL/CICS/VSAM mainframe environment

spring.application.name=carddemo-java

# H2 Database (replaces VSAM files)
spring.datasource.url=jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Logging
logging.level.com.cardemo=INFO
