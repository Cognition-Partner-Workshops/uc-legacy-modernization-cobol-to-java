spring:
  datasource:
    url: jdbc:h2:mem:carddemo-batch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
carddemo:
  usrsec:
    input-file: ${user.dir}/../app/data/EBCDIC/AWS.M2.CARDDEMO.USRSEC.PS
