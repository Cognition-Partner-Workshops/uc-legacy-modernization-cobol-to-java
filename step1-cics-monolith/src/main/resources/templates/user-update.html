<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>CardDemo - User Update</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', monospace; font-size: 14px; margin: 0; padding: 20px; }
        .screen { width: 80ch; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #0f0; padding-bottom: 5px; margin-bottom: 10px; }
        .title { text-align: center; font-size: 18px; margin: 20px 0; }
        .form-row { margin: 5px 0; }
        .form-row label { display: inline-block; width: 25ch; }
        .form-row input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 2px 5px; font-family: 'Courier New', monospace; font-size: 14px; }
        .error { color: #f00; margin: 10px 0; }
        .footer { border-top: 1px solid #0f0; padding-top: 5px; margin-top: 20px; }
        .btn { background: #0f0; color: #000; border: none; padding: 5px 15px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 14px; margin: 5px; }
    </style>
</head>
<body>
<div class="screen">
    <div class="header">
        <span th:text="${title01}">AWS CardDemo</span>
        <span th:text="${currentDate}">MM/DD/YY</span>
        <span th:text="${currentTime}">HH:MM:SS</span>
    </div>
    <div class="header">
        <span>Tran: <span th:text="${tranId}">CU02</span></span>
        <span>Pgm: <span th:text="${pgmName}">COUSR02C</span></span>
    </div>
    <div class="title">USER UPDATE</div>
    <form method="post" th:action="@{/admin/user/update}">
        <div class="form-row">
            <label for="userId">USER ID:</label>
            <input type="text" id="userId" name="userId" maxlength="8" th:value="${user != null ? user.secUsrId : ''}" autofocus="autofocus"/>
        </div>
        <div th:if="${user != null}" style="margin-top: 10px;">
            <div class="form-row">
                <label for="firstName">FIRST NAME:</label>
                <input type="text" id="firstName" name="firstName" maxlength="20" th:value="${user.secUsrFname}"/>
            </div>
            <div class="form-row">
                <label for="lastName">LAST NAME:</label>
                <input type="text" id="lastName" name="lastName" maxlength="20" th:value="${user.secUsrLname}"/>
            </div>
            <div class="form-row">
                <label for="password">PASSWORD:</label>
                <input type="password" id="password" name="password" maxlength="8"/>
            </div>
            <div class="form-row">
                <label for="userType">USER TYPE (A/U):</label>
                <input type="text" id="userType" name="userType" maxlength="1" th:value="${user.secUsrType}"/>
            </div>
            <div class="form-row">
                <label for="confirm">CONFIRM (Y/N):</label>
                <input type="text" id="confirm" name="confirm" maxlength="1"/>
            </div>
        </div>
        <div class="error" th:if="${errorMessage != null and !errorMessage.isEmpty()}" th:text="${errorMessage}"></div>
        <div style="margin-top: 10px;">
            <button type="submit" class="btn">ENTER</button>
            <button type="submit" name="action" value="PF3" class="btn">PF3 Back</button>
        </div>
    </form>
    <div class="footer">
        <span>ENTER = Update | PF3 = User List</span>
    </div>
</div>
</body>
</html>
