<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>CardDemo - Card View</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', monospace; font-size: 14px; margin: 0; padding: 20px; }
        .screen { width: 80ch; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #0f0; padding-bottom: 5px; margin-bottom: 10px; }
        .title { text-align: center; font-size: 18px; margin: 20px 0; }
        .form-row { margin: 5px 0; }
        .form-row label { display: inline-block; width: 25ch; }
        .form-row input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 2px 5px; font-family: 'Courier New', monospace; font-size: 14px; }
        .data-row { margin: 3px 0; }
        .data-label { display: inline-block; width: 25ch; color: #0a0; }
        .error { color: #f00; margin: 10px 0; }
        .footer { border-top: 1px solid #0f0; padding-top: 5px; margin-top: 20px; }
        .btn { background: #0f0; color: #000; border: none; padding: 5px 15px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 14px; margin: 5px; }
    </style>
</head>
<body>
<div class="screen">
    <div class="header">
        <span th:text="${title01}">AWS CardDemo</span>
        <span th:text="${currentDate}">MM/DD/YY</span>
        <span th:text="${currentTime}">HH:MM:SS</span>
    </div>
    <div class="header">
        <span>Tran: <span th:text="${tranId}">CC02</span></span>
        <span>Pgm: <span th:text="${pgmName}">COCRDSLC</span></span>
    </div>
    <div class="title">CREDIT CARD VIEW</div>
    <form method="post" th:action="@{/card/select}">
        <div class="form-row">
            <label for="cardNum">CARD NUMBER:</label>
            <input type="text" id="cardNum" name="cardNum" maxlength="16" autofocus="autofocus"/>
        </div>
        <div class="error" th:if="${errorMessage != null and !errorMessage.isEmpty()}" th:text="${errorMessage}"></div>
        <div th:if="${card != null}" style="margin-top: 15px; border: 1px solid #0f0; padding: 10px;">
            <div class="data-row"><span class="data-label">Card Number:</span><span th:text="${card.cardNum}"></span></div>
            <div class="data-row"><span class="data-label">Account ID:</span><span th:text="${card.cardAcctId}"></span></div>
            <div class="data-row"><span class="data-label">CVV Code:</span><span th:text="${card.cardCvvCd}"></span></div>
            <div class="data-row"><span class="data-label">Embossed Name:</span><span th:text="${card.cardEmbossedName}"></span></div>
            <div class="data-row"><span class="data-label">Expiration Date:</span><span th:text="${card.cardExpiraionDate}"></span></div>
            <div class="data-row"><span class="data-label">Active Status:</span><span th:text="${card.cardActiveStatus}"></span></div>
            <div th:if="${xref != null}">
                <div class="data-row"><span class="data-label">Customer ID:</span><span th:text="${xref.xrefCustId}"></span></div>
            </div>
        </div>
        <div style="margin-top: 10px;">
            <button type="submit" class="btn">ENTER</button>
            <button type="submit" name="action" value="PF3" class="btn">PF3 Back</button>
        </div>
    </form>
    <div class="footer">
        <span>ENTER = View | PF3 = Main Menu</span>
    </div>
</div>
</body>
</html>
