<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>CardDemo - Transaction Add</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', monospace; font-size: 14px; margin: 0; padding: 20px; }
        .screen { width: 80ch; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #0f0; padding-bottom: 5px; margin-bottom: 10px; }
        .title { text-align: center; font-size: 18px; margin: 20px 0; }
        .form-row { margin: 5px 0; }
        .form-row label { display: inline-block; width: 25ch; }
        .form-row input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 2px 5px; font-family: 'Courier New', monospace; font-size: 14px; }
        .error { color: #f00; margin: 10px 0; }
        .footer { border-top: 1px solid #0f0; padding-top: 5px; margin-top: 20px; }
        .btn { background: #0f0; color: #000; border: none; padding: 5px 15px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 14px; margin: 5px; }
    </style>
</head>
<body>
<div class="screen">
    <div class="header">
        <span th:text="${title01}">AWS CardDemo</span>
        <span th:text="${currentDate}">MM/DD/YY</span>
        <span th:text="${currentTime}">HH:MM:SS</span>
    </div>
    <div class="header">
        <span>Tran: <span th:text="${tranId}">CT02</span></span>
        <span>Pgm: <span th:text="${pgmName}">COTRN02C</span></span>
    </div>
    <div class="title">TRANSACTION ADD</div>
    <form method="post" th:action="@{/transaction/add}">
        <div class="form-row">
            <label for="acctId">ACCOUNT ID:</label>
            <input type="text" id="acctId" name="acctId" maxlength="11" th:value="${acctId}" autofocus="autofocus"/>
        </div>
        <div class="form-row">
            <label for="cardNum">CARD NUMBER:</label>
            <input type="text" id="cardNum" name="cardNum" maxlength="16" th:value="${cardNum}"/>
        </div>
        <div class="form-row">
            <label for="typeCd">TYPE CD:</label>
            <input type="text" id="typeCd" name="typeCd" maxlength="2" th:value="${typeCd}"/>
        </div>
        <div class="form-row">
            <label for="catCd">CATEGORY CD:</label>
            <input type="text" id="catCd" name="catCd" maxlength="4" th:value="${catCd}"/>
        </div>
        <div class="form-row">
            <label for="source">SOURCE:</label>
            <input type="text" id="source" name="source" maxlength="10" th:value="${source}"/>
        </div>
        <div class="form-row">
            <label for="description">DESCRIPTION:</label>
            <input type="text" id="description" name="description" maxlength="100" size="60" th:value="${description}"/>
        </div>
        <div class="form-row">
            <label for="amount">AMOUNT (-99999999.99):</label>
            <input type="text" id="amount" name="amount" maxlength="12" th:value="${amount}"/>
        </div>
        <div class="form-row">
            <label for="origDate">ORIG DATE (YYYY-MM-DD):</label>
            <input type="text" id="origDate" name="origDate" maxlength="26" th:value="${origDate}"/>
        </div>
        <div class="form-row">
            <label for="procDate">PROC DATE (YYYY-MM-DD):</label>
            <input type="text" id="procDate" name="procDate" maxlength="26" th:value="${procDate}"/>
        </div>
        <div class="form-row">
            <label for="merchantId">MERCHANT ID:</label>
            <input type="text" id="merchantId" name="merchantId" maxlength="9" th:value="${merchantId}"/>
        </div>
        <div class="form-row">
            <label for="merchantName">MERCHANT NAME:</label>
            <input type="text" id="merchantName" name="merchantName" maxlength="50" th:value="${merchantName}"/>
        </div>
        <div class="form-row">
            <label for="merchantCity">MERCHANT CITY:</label>
            <input type="text" id="merchantCity" name="merchantCity" maxlength="50" th:value="${merchantCity}"/>
        </div>
        <div class="form-row">
            <label for="merchantZip">MERCHANT ZIP:</label>
            <input type="text" id="merchantZip" name="merchantZip" maxlength="10" th:value="${merchantZip}"/>
        </div>
        <div class="form-row" style="margin-top: 10px;">
            <label for="confirm">CONFIRM (Y/N):</label>
            <input type="text" id="confirm" name="confirm" maxlength="1"/>
        </div>
        <div class="error" th:if="${errorMessage != null and !errorMessage.isEmpty()}" th:text="${errorMessage}"></div>
        <div style="margin-top: 10px;">
            <button type="submit" class="btn">ENTER</button>
            <button type="submit" name="action" value="PF3" class="btn">PF3 Back</button>
            <button type="submit" name="action" value="PF4" class="btn">PF4 Clear</button>
        </div>
    </form>
    <div class="footer">
        <span>ENTER = Add | PF3 = Menu | PF4 = Clear</span>
    </div>
</div>
</body>
</html>
