<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>CardDemo - Admin Menu</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', monospace; font-size: 14px; margin: 0; padding: 20px; }
        .screen { width: 80ch; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #0f0; padding-bottom: 5px; margin-bottom: 10px; }
        .title { text-align: center; font-size: 18px; margin: 20px 0; }
        .menu-item { margin: 5px 0; }
        .form-row { margin: 10px 0; }
        .form-row label { display: inline-block; width: 20ch; }
        .form-row input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 2px 5px; font-family: 'Courier New', monospace; font-size: 14px; width: 10ch; }
        .error { color: #f00; margin: 10px 0; }
        .footer { border-top: 1px solid #0f0; padding-top: 5px; margin-top: 20px; }
        .btn { background: #0f0; color: #000; border: none; padding: 5px 15px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 14px; margin: 5px; }
    </style>
</head>
<body>
<div class="screen">
    <div class="header">
        <span th:text="${title01}">AWS CardDemo</span>
        <span th:text="${currentDate}">MM/DD/YY</span>
        <span th:text="${currentTime}">HH:MM:SS</span>
    </div>
    <div class="header">
        <span>Tran: <span th:text="${tranId}">CA00</span></span>
        <span>Pgm: <span th:text="${pgmName}">COADM01C</span></span>
    </div>
    <div class="title">ADMIN MENU</div>
    <form method="post" th:action="@{/admin}">
        <div th:each="opt : ${adminOptions}" class="menu-item">
            <span th:text="|  ${opt.number()}. ${opt.name()}|"></span>
        </div>
        <div class="form-row" style="margin-top: 20px;">
            <label for="option">OPTION:</label>
            <input type="text" id="option" name="option" maxlength="2" autofocus="autofocus"/>
        </div>
        <div class="error" th:if="${errorMessage != null and !errorMessage.isEmpty()}" th:text="${errorMessage}"></div>
        <div style="margin-top: 10px;">
            <button type="submit" class="btn">ENTER</button>
            <button type="submit" name="action" value="PF3" class="btn">PF3 Back</button>
        </div>
    </form>
    <div class="footer">
        <span>ENTER = Select Option | PF3 = Main Menu</span>
    </div>
</div>
</body>
</html>
