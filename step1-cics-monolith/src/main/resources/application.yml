spring:
  application:
    name: carddemo-monolith

  datasource:
    url: jdbc:postgresql://localhost:5432/carddemo_db
    username: carddemo
    password: carddemo
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  session:
    store-type: none

server:
  port: 8080
  servlet:
    session:
      timeout: 30m

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:carddemo_db;DB_CLOSE_DELAY=-1;NON_KEYWORDS=TRANSACTION
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:carddemo_test;DB_CLOSE_DELAY=-1;NON_KEYWORDS=TRANSACTION
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: always
