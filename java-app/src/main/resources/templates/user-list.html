<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CardDemo - User List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <div class="header">
        <span class="header-title">CardDemo Application</span>
        <span class="header-info">
            <span th:text="${programName}">COUSR00C</span> |
            Date: <span th:text="${currentDate}">MM/DD/YY</span> |
            Time: <span th:text="${currentTime}">HH:MM:SS</span> |
            User: <span th:text="${userId}">ADMIN</span> |
            <a th:href="@{/logout}" class="logout-link">Sign Off</a>
        </span>
    </div>

    <h1 class="page-title">User List</h1>

    <div th:if="${successMessage}" class="message-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="message-error" th:text="${errorMessage}"></div>

    <table class="data-table">
        <tr>
            <th>User ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Type</th>
            <th>Actions</th>
        </tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.userId}"></td>
            <td th:text="${user.firstName}"></td>
            <td th:text="${user.lastName}"></td>
            <td th:text="${user.userType == 'A' ? 'Admin' : 'User'}"></td>
            <td>
                <a th:href="@{'/admin/users/update/' + ${user.userId}}">Update</a> |
                <form th:action="@{'/admin/users/delete/' + ${user.userId}}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger" style="padding: 2px 8px; font-size: 0.8em;"
                            onclick="return confirm('Delete user ' + this.closest('tr').children[0].textContent + '?');">Delete</button>
                </form>
            </td>
        </tr>
    </table>

    <div class="nav-links">
        <a th:href="@{/admin/users/add}">Add New User</a> |
        <a th:href="@{/admin/menu}">Back to Admin Menu</a>
    </div>
</div>
</body>
</html>
