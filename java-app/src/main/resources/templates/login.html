<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CardDemo - Sign On</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <div class="header">
        <span class="header-title">CardDemo Application</span>
        <span class="header-info">
            COSGN00C |
            Date: <span th:text="${currentDate}">MM/DD/YY</span> |
            Time: <span th:text="${currentTime}">HH:MM:SS</span>
        </span>
    </div>

    <div class="login-container">
        <h1 class="page-title">Sign On</h1>

        <div th:if="${param.error}" class="message-error">
            Invalid User ID or Password. Please try again.
        </div>
        <div th:if="${param.logout}" class="message-success">
            You have been signed off successfully.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">User ID:</label>
                <input type="text" id="username" name="username" maxlength="8"
                       placeholder="Enter User ID" required autofocus
                       style="width: 180px; text-transform: uppercase;"/>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" maxlength="8"
                       placeholder="Enter Password" required
                       style="width: 180px;"/>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn">Sign On</button>
            </div>
        </form>
    </div>

    <div class="footer">
        CardDemo - Credit Card Management System
    </div>
</div>
</body>
</html>
